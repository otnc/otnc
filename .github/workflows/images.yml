name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - README.base.md
      - .kiritanconfig
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate stats card (en)
        continue-on-error: true
        uses: cicirello/user-statistician@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-file: images/userstats.svg
          colors: dark
          locale: en
          commit-and-push: false

      - name: Generate stats card (ja)
        continue-on-error: true
        uses: cicirello/user-statistician@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-file: images/userstats.ja.svg
          colors: dark
          locale: ja
          commit-and-push: false

      - name: Generate lifetime stats
        continue-on-error: true
        run: node scripts/lifetime-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update recent activity
        continue-on-error: true
        run: node scripts/recent-activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build README with kiritan
        run: npx kiritan build

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.base.md README.md README.ja.md images/*.svg
          git commit -m "Update README" || exit 0
          git push
